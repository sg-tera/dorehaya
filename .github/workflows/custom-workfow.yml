name: Deploy Static Site

on:
  # mainブランチにpushされたら実行
  push:
    branches: ["main"]
  # 手動実行も許可
  workflow_dispatch:

# GITHUB_TOKENの権限設定（Pagesへのデプロイに必須）
permissions:
  contents: read
  pages: write
  id-token: write

# 同時実行の制御（連打されたときに古いデプロイをキャンセルして最新を優先）
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      # 1. コードをチェックアウト（これがないと始まらない）
      - name: Checkout
        uses: actions/checkout@v4

      # 2. noscriptを自動生成
      - name: Generate noscript SEO content
        run: node generate-noscript.js

      # 3. Pagesのセットアップ
      - name: Setup Pages
        uses: actions/configure-pages@v4

      # 4. アーティファクトのアップロード
      # ビルド不要なので、カレントディレクトリ(.)をそのままzipしてアップロード
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      # 5. デプロイ実行
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4